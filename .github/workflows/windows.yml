name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: cargo build --release --workspace
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ddtrust.exe dist/
          Copy-Item target/release/ddtrust-gui.exe dist/
          Copy-Item LICENSE, NOTICE, docs/WINDOWS.md dist/
          Compress-Archive -Path dist/* -DestinationPath dist/DDTRust-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DDTRust-windows-x86_64
          path: dist/DDTRust-windows-x86_64.zip
